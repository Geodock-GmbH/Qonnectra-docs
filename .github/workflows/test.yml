name: Tests
on:
  push:
    branches:
      - main
  # Deliberately without a branch filter: the manual is written in a stack of
  # pull requests that target each other (chapters 12-15 -> 16-18 -> ...), and a
  # filter on "main" would leave all but the bottom one untested.
  pull_request:
  # Pushes to main run every spec anyway; this is the same for any other ref,
  # e.g. to check a pull request against tests/captures.lock as a whole.
  workflow_dispatch:
    inputs:
      all:
        description: Run every spec, not only the stale ones
        type: boolean
        default: true

# An outdated run of the capture job is worth nothing and occupies a runner for
# the better part of an hour.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Run spellcheck
        run: pnpm lint:spelling

  gender:
    name: Gender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Run spellcheck
        run: pnpm lint:gender

  captures:
    name: Captures
    runs-on: ubuntu-latest
    # Stack setup ~4 min, every spec ~25 min.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      # Cheap, and it fails before the expensive part: a spec that captures
      # through page.screenshot() instead of shoot() produces images that catch
      # animations halfway through, a video spec without postProcessVideo()
      # publishes an uncropped, unchecked recording.
      - name: Lint the specs
        run: pnpm lint:captures

      # Which specs this run is for. A pull request runs the specs whose inputs
      # differ from tests/captures.lock (scripts/capture-fingerprint.sh); main
      # and a manual run with "all" run every one of them. When nothing is
      # stale, the stack is never started.
      #
      # Nothing here writes the lock: a stale spec whose images still come out
      # the same passes, and stays stale until someone publishes it locally.
      - name: Select the specs
        id: select
        run: |
          if [ "${{ github.event_name }}" = push ] || [ "${{ inputs.all }}" = true ]; then
            echo "Running every spec."
            echo "args=--all" >>"$GITHUB_OUTPUT"
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          stale="$(scripts/capture-fingerprint.sh --stale)"
          if [ -z "$stale" ]; then
            echo "Every spec matches tests/captures.lock - nothing to capture."
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "Stale against tests/captures.lock:"
            echo "$stale" | sed 's/^/  /'
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi

      # The ubuntu-24.04 runner image does not ship ImageMagick. `convert` turns
      # the captures into JPEG, `compare` is the gate that decides whether an
      # image changed at all. Installed before the stack, so a missing package
      # fails within seconds instead of after it.
      - name: Install ImageMagick
        if: steps.select.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          convert -version | head -n 1

      # *.localhost resolves to loopback on its own (RFC 6761), but on the
      # runner it answers with ::1 first. The entries pin it to IPv4, where the
      # containers publish their ports.
      - name: Point the local domains at the loopback interface
        if: steps.select.outputs.run == 'true'
        run: |
          sudo tee -a /etc/hosts >/dev/null <<'EOF'
          127.0.0.1 qonnectra.localhost
          127.0.0.1 app.qonnectra.localhost
          127.0.0.1 api.qonnectra.localhost
          127.0.0.1 admin.qonnectra.localhost
          127.0.0.1 files.qonnectra.localhost
          127.0.0.1 qgis.qonnectra.localhost
          127.0.0.1 tiles.qonnectra.localhost
          EOF

      # Clones github.com/Geodock-GmbH/Qonnectra (public) at the release pinned
      # in the script, builds the images, starts the production compose file and
      # imports the demo project. The pin is what makes this job a gate at all:
      # against the default branch it would go red whenever the app moved,
      # whether or not the pull request touched anything.
      #
      # No step frees disk space beforehand. It used to delete the preinstalled
      # toolchains (2 min), but the runner has a 145 GB disk now, and the stack
      # plus the capture image take around 10 GB. The df is there so the next
      # shrink of the runner shows up here first.
      - name: Start the local Qonnectra instance
        if: steps.select.outputs.run == 'true'
        run: |
          df -h /
          scripts/setup-local-qonnectra.sh
          df -h /

      # Images and recordings in one run, in the capture container rather than
      # on the runner: the app asks for `system-ui` and ships no font, so every
      # glyph comes from the machine running the browser - the first CI run
      # reported all 50 images as changed for that reason alone.
      # scripts/capture.sh builds the image on demand.
      #
      # Every recording checks itself (verifyVideo() in
      # playwright/manual-videos.ts), so a broken interaction and a crop
      # pointing past the interface both fail here.
      - name: Capture
        if: steps.select.outputs.run == 'true'
        run: pnpm test:e2e ${{ steps.select.outputs.args }}

      - name: Publish the screenshots into the manual
        if: ${{ !cancelled() && steps.select.outputs.run == 'true' }}
        run: pnpm screenshots:publish --images

      # screenshots:publish only writes an image whose picture differs from the
      # committed one - without any tolerance - so anything left here is a real
      # difference between the manual and the app as it currently builds.
      # Recordings are never compared: two runs of the same spec differ by a
      # handful of frames whatever anyone does.
      - name: Fail if the published screenshots are out of date
        if: ${{ !cancelled() && steps.select.outputs.run == 'true' }}
        run: |
          changed="$(git status --porcelain -- public/images/)"
          if [ -z "$changed" ]; then
            echo "The published screenshots match this run."
            exit 0
          fi

          echo "$changed"
          mkdir -p screenshot-diff
          echo "$changed" | sed 's/^...//' | while read -r file; do
            [ -f "$file" ] && cp "$file" screenshot-diff/
          done

          echo "::error::The manual's screenshots do not match this run. Regenerate them with 'pnpm test:e2e && pnpm screenshots:publish' and commit the result, or check the artifact 'screenshots-from-this-run' for what changed."
          exit 1

      - name: Upload the differing screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-from-this-run
          path: screenshot-diff/
          if-no-files-found: ignore

      # The recordings themselves, so a failed check can be looked at without
      # reproducing the run. They are not compared with anything - this is for
      # eyes, not for a diff.
      - name: Upload the recordings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recordings-from-this-run
          path: tests/videos/
          if-no-files-found: ignore

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
