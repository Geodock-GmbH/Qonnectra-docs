name: Tests
on:
  push:
    branches:
      - main
  # Deliberately without a branch filter: the manual is written in a stack of
  # pull requests that target each other (chapters 12-15 -> 16-18 -> ...), and a
  # filter on "main" would leave all but the bottom one untested.
  pull_request:

# An outdated run of the capture job is worth nothing and occupies a runner for
# the better part of an hour.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spelling:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Run spellcheck
        run: pnpm lint:spelling

  captures:
    name: Captures
    runs-on: ubuntu-latest
    # Docker build of the app ~15 min, map tiles ~10 min on a cache miss, the
    # image specs ~10 min and the recordings a few more.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      # The app image plus qgis-server, tileserver and postgis do not fit next
      # to the preinstalled toolchains of the runner.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      # Cheap, and it fails before the expensive part: a spec that captures
      # through page.screenshot() instead of shoot() produces images that catch
      # animations halfway through.
      - name: Check that no spec captures directly
        run: pnpm lint:captures

      # Planetiler needs Java 21+ for the map tiles. Without them the tileserver
      # restart-loops, the map falls back to OSM raster tiles and every map
      # screenshot differs from the published one.
      - name: Setup Java for Planetiler
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Only the finished tiles and the Planetiler jar, not its intermediate
      # downloads - around 230 MB instead of 1.8 GB. The region is fixed
      # (schleswig-holstein, where the test project lies), so the key is too:
      # the cache is rebuilt by bumping the suffix, not by a hash.
      - name: Cache the map tiles
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/qonnectra-local-tiles/planetiler.jar
            ~/.local/share/qonnectra-local-tiles/schleswig-holstein.mbtiles
          key: qonnectra-tiles-schleswig-holstein-v1

      # *.localhost resolves to loopback on its own (RFC 6761), but on the
      # runner it answers with ::1 first. The entries pin it to IPv4, where the
      # containers publish their ports.
      - name: Point the local domains at the loopback interface
        run: |
          sudo tee -a /etc/hosts >/dev/null <<'EOF'
          127.0.0.1 qonnectra.localhost
          127.0.0.1 app.qonnectra.localhost
          127.0.0.1 api.qonnectra.localhost
          127.0.0.1 admin.qonnectra.localhost
          127.0.0.1 files.qonnectra.localhost
          127.0.0.1 qgis.qonnectra.localhost
          127.0.0.1 tiles.qonnectra.localhost
          EOF

      # Clones github.com/Geodock-GmbH/Qonnectra (public) at the release pinned
      # in the script, builds the images, starts the production compose file and
      # imports the demo project. The pin is what makes this job a gate at all:
      # against the default branch it would go red whenever the app moved,
      # whether or not the pull request touched anything.
      - name: Start the local Qonnectra instance
        run: scripts/setup-local-qonnectra.sh

      # ffmpeg as well as the browser: Playwright encodes the recordings with it,
      # and scripts/check-videos.sh reads them back with the same binary.
      - name: Install Chromium and ffmpeg
        run: pnpm exec playwright install --with-deps chromium ffmpeg

      # The two capture runs come first, both of them. They are the part that
      # actually exercises the app, and a failure here is a broken interaction,
      # not a stale image.
      #
      # Without the videos - a recording is never byte-identical, see the
      # project "videos" in playwright.config.ts.
      - name: Take the screenshots
        run: pnpm test:e2e

      # The recordings are produced but never compared with the published ones:
      # two runs of the same spec differ by a handful of frames whatever anyone
      # does. What this catches is the interaction breaking - the specs assert
      # their way through every step, so a moved button fails here long before
      # anyone notices it in the manual.
      - name: Record the videos
        if: ${{ !cancelled() }}
        run: pnpm test:e2e:videos

      - name: Publish the screenshots into the manual
        if: ${{ !cancelled() }}
        run: pnpm screenshots:publish --images

      # screenshots:publish only writes an image whose picture actually differs
      # from the published one, so anything left here is a real difference
      # between the manual and the app as it currently builds.
      - name: Fail if the published screenshots are out of date
        if: ${{ !cancelled() }}
        run: |
          changed="$(git status --porcelain -- public/images/)"
          if [ -z "$changed" ]; then
            echo "The published screenshots match this run."
            exit 0
          fi

          echo "$changed"
          mkdir -p screenshot-diff
          echo "$changed" | sed 's/^...//' | while read -r file; do
            [ -f "$file" ] && cp "$file" screenshot-diff/
          done

          echo "::error::The manual's screenshots do not match this run. Regenerate them with 'pnpm test:e2e && pnpm screenshots:publish --images' and commit the result, or check the artifact 'screenshots-from-this-run' for what changed."
          exit 1

      # What the specs themselves cannot see: the crop runs after the recording
      # and knows nothing about the layout, so it can end up pointing past the
      # interface while every assertion still passes. Deliberately the last
      # check, and deliberately not a comparison with public/videos/.
      - name: Check the recordings
        if: ${{ !cancelled() }}
        run: pnpm check:videos

      - name: Upload the differing screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-from-this-run
          path: screenshot-diff/
          if-no-files-found: ignore

      # The recordings themselves, so a failed check can be looked at without
      # reproducing the run. They are not compared with anything - this is for
      # eyes, not for a diff.
      - name: Upload the recordings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: recordings-from-this-run
          path: tests/videos/
          if-no-files-found: ignore

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
