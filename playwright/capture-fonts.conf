<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Makes Noto Sans the font the captures are taken with.

  The app asks for `system-ui, sans-serif` (app.css) and brings no font of its
  own, so this file decides what every screenshot of the manual looks like.
  Without it the Playwright base image answers both with WenQuanYi Zen Hei.
-->
<fontconfig>
	<alias>
		<family>system-ui</family>
		<prefer><family>Noto Sans</family></prefer>
	</alias>
	<alias>
		<family>sans-serif</family>
		<prefer><family>Noto Sans</family></prefer>
	</alias>
	<alias>
		<family>sans</family>
		<prefer><family>Noto Sans</family></prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer><family>Noto Sans Mono</family></prefer>
	</alias>
</fontconfig>
